<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Your Song</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    h1 { font-size: 1.4rem; margin-bottom: 0.4rem; }
    .subtitle { color: #888; font-size: 0.875rem; margin-bottom: 2rem; }

    .step { display: none; }
    .step.active { display: block; }

    label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.35rem; }

    input[type="email"],
    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 1rem;
    }
    input:focus { border-color: #5a7fff; }
    input[type="file"] { cursor: pointer; }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #5a7fff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #3f60e8; }
    button:disabled { background: #333; color: #666; cursor: default; }

    .msg {
      margin-top: 1rem;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }
    .msg.error  { background: #2d1212; border: 1px solid #7a2020; color: #f08080; display: block; }
    .msg.success { background: #122d18; border: 1px solid #207a30; color: #80f098; display: block; }
    .msg.info   { background: #12202d; border: 1px solid #205a7a; color: #80c8f0; display: block; }

    .step-indicator { font-size: 0.75rem; color: #555; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
<div class="card">
  <h1>Submit Your Song</h1>
  <p class="subtitle">Share your music with us</p>

  <!-- Step 1: email -->
  <div class="step active" id="step1">
    <p class="step-indicator">Step 1 of 3 — Verify your email</p>
    <label for="email">Your email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    <button id="btnRequestCode">Send confirmation code</button>
    <div id="msg1" class="msg"></div>
  </div>

  <!-- Step 2: code -->
  <div class="step" id="step2">
    <p class="step-indicator">Step 2 of 3 — Enter confirmation code</p>
    <label for="code">6-digit code sent to your email</label>
    <input type="text" id="code" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
    <button id="btnVerifyCode">Continue</button>
    <div id="msg2" class="msg"></div>
  </div>

  <!-- Step 3: upload -->
  <div class="step" id="step3">
    <p class="step-indicator">Step 3 of 3 — Upload your song</p>
    <label for="songTitle">Song title</label>
    <input type="text" id="songTitle" placeholder="My Song" />
    <label for="songArtist">Artist name</label>
    <input type="text" id="songArtist" placeholder="Your Name" />
    <label for="songFile">Audio file (mp3, wav, flac, ogg, opus, aac, m4a — max 200 MB)</label>
    <input type="file" id="songFile" accept=".mp3,.wav,.flac,.ogg,.opus,.aac,.m4a,audio/*" />
    <button id="btnUpload">Upload song</button>
    <div id="msg3" class="msg"></div>
  </div>
</div>

<script>
  const API = '/datanest/public/songs';

  let verifiedEmail = '';
  let verifiedCode  = '';

  function show(msgEl, type, text) {
    msgEl.className = 'msg ' + type;
    msgEl.textContent = text;
  }

  function goStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + n).classList.add('active');
  }

  // Step 1
  document.getElementById('btnRequestCode').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const msg   = document.getElementById('msg1');
    const btn   = document.getElementById('btnRequestCode');
    if (!email || !email.includes('@')) { show(msg, 'error', 'Please enter a valid email address.'); return; }

    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      const res = await fetch(API + '/request-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!res.ok) { show(msg, 'error', data.error || 'Failed to send code.'); return; }
      verifiedEmail = email;
      show(msg, 'success', 'Code sent! Check your inbox.');
      setTimeout(() => goStep(2), 800);
    } catch (e) {
      show(msg, 'error', 'Network error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send confirmation code';
    }
  });

  // Step 2 — just store the code, actual verification happens on upload
  document.getElementById('btnVerifyCode').addEventListener('click', () => {
    const code = document.getElementById('code').value.trim();
    const msg  = document.getElementById('msg2');
    if (!/^\d{6}$/.test(code)) { show(msg, 'error', 'Please enter the 6-digit code from your email.'); return; }
    verifiedCode = code;
    goStep(3);
  });

  // Step 3
  document.getElementById('btnUpload').addEventListener('click', async () => {
    const title  = document.getElementById('songTitle').value.trim();
    const artist = document.getElementById('songArtist').value.trim();
    const file   = document.getElementById('songFile').files[0];
    const msg    = document.getElementById('msg3');
    const btn    = document.getElementById('btnUpload');

    if (!file) { show(msg, 'error', 'Please select an audio file.'); return; }

    const fd = new FormData();
    fd.append('email',  verifiedEmail);
    fd.append('code',   verifiedCode);
    fd.append('title',  title);
    fd.append('artist', artist);
    fd.append('file',   file);

    btn.disabled = true;
    btn.textContent = 'Uploading…';
    show(msg, 'info', 'Uploading, please wait…');

    try {
      const res  = await fetch(API + '/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) { show(msg, 'error', 'Invalid or expired code. Please start over.'); return; }
        show(msg, 'error', data.error || 'Upload failed.');
        return;
      }
      show(msg, 'success', data.message || 'Song uploaded successfully. Thank you!');
      btn.textContent = 'Done!';
    } catch (e) {
      show(msg, 'error', 'Network error. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Upload song';
    }
  });
</script>
</body>
</html>
