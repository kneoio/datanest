# Application
quarkus.application.name=datanest
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.package.jar.type=uber-jar
quarkus.http.port=38799
quarkus.http.limits.max-body-size=1G
quarkus.index-dependency.core.group-id=com.semantyca
quarkus.index-dependency.officeframe.group-id=com.semantyca
quarkus.arc.exclude-types=com.semantyca.core.jwt.JWTCallerPrincipalFactory,io.smallrye.jwt.auth.cdi.JWTCallerPrincipalFactoryProducer


# Suppress verbose FFmpeg wrapper output
quarkus.log.category."net.bramp.ffmpeg".level=WARN
quarkus.log.category."net.bramp.ffmpeg.builder".level=ERROR
quarkus.log.category."net.bramp.ffmpeg.RunProcessFunction".level=ERROR
